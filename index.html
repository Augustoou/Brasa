<style>
:root{
  --ink:#0B0F12; --surface:#141A1E; --raise:#1D252A; --line:#273137;
  --bone:#EEF3F4; --fog:#84939A; --dim:#5A686F;
  --ember:#FF6B1A; --flame:#FFB020; --gold:#FFD84D; --steel:#4E9FC4;
  --ok:#4FBF7E; --warn:#E8A33D; --bad:#E0553F;
  --r:16px; --rl:22px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--ink); color:var(--bone);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none}
input:focus,select,textarea:focus{border-color:var(--dim)}
input[type=number]{font-variant-numeric:tabular-nums}
::placeholder{color:var(--dim)}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fog) 50%),linear-gradient(135deg,var(--fog) 50%,transparent 50%);background-position:calc(100% - 18px) 51%,calc(100% - 13px) 51%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* ---------- shell ---------- */
#app{min-height:100%;padding-bottom:calc(78px + var(--safe-b))}
.screen{display:none;padding:0 18px 30px}
.screen.on{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{padding:calc(var(--safe-t) + 18px) 18px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.top .sub{color:var(--fog);font-size:13px;margin-top:3px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:var(--bone);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px 14px calc(8px + var(--safe-b));
  background:rgba(11,15,18,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--dim);font-size:10.5px;letter-spacing:.01em;transition:color .15s}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ember)}

/* ---------- structural pieces (deliberately different per content type) ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:18px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px}
.rowlist{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line)}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 11px}
.sect h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
.sect button{color:var(--ember);font-size:14px;font-weight:600}
.muted{color:var(--fog)}
.tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.04em}
.unit{font-size:.52em;font-weight:600;color:var(--fog);letter-spacing:0}
.empty{text-align:center;padding:34px 20px;color:var(--fog)}
.empty strong{display:block;color:var(--bone);font-size:16px;margin-bottom:5px;font-weight:600}

a.btn{text-decoration:none}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;background:var(--ember);color:#160800;font-weight:700;letter-spacing:-.01em}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--raise);color:var(--bone);border:1px solid var(--line)}
.btn.slim{padding:11px;font-size:14.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ember);border-color:var(--ember);color:#160800;font-weight:700}
.scroller{display:flex;gap:9px;overflow-x:auto;padding:2px 18px 4px;margin:0 -18px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}

/* heat bar — the signature progress element */
.heat{height:7px;border-radius:99px;background:var(--raise);overflow:hidden;position:relative}
.heat>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8A3A0E,var(--ember) 55%,var(--flame));transition:width .45s cubic-bezier(.3,.9,.3,1)}

/* today's workout hero */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--surface);border:1px solid var(--line);padding:20px;margin-bottom:16px}
.hero .glow{position:absolute;inset:auto -30% -70% -30%;height:190px;background:radial-gradient(closest-side,rgba(255,107,26,.30),transparent 72%);pointer-events:none;transition:opacity .5s}
.hero .kick{font-size:13px;color:var(--ember);font-weight:600;margin-bottom:5px}
.hero h3{margin:0;font-size:27px;font-weight:800;letter-spacing:-.035em}
.hero .meta{display:flex;gap:16px;margin:14px 0 15px;color:var(--fog);font-size:13.5px}
.hero .meta b{color:var(--bone);font-weight:700}

/* exercise rows */
.ex{border-bottom:1px solid var(--line);padding:14px 2px}
.ex-head{display:flex;align-items:center;gap:13px}
.tick{width:27px;height:27px;border-radius:9px;border:1.8px solid var(--line);flex:none;display:grid;place-items:center;transition:.18s}
.tick svg{width:14px;height:14px;stroke:#160800;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ex.done .tick{background:var(--ember);border-color:var(--ember)}
.ex.done .tick svg{opacity:1}
.ex.done .ex-name{color:var(--fog)}
.ex-name{font-weight:600;letter-spacing:-.01em;line-height:1.25}
.ex-sub{color:var(--fog);font-size:12.5px;margin-top:2px}
.ex-load{margin-left:auto;text-align:right;flex:none}
.ex-load .num{font-size:23px}
.ex-open{padding:0 4px;color:var(--dim)}
.ex-open svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.ex.open .ex-open svg{transform:rotate(180deg)}
.ex-body{display:none;padding:14px 0 4px}
.ex.open .ex-body{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.field label{display:block;font-size:12px;color:var(--fog);margin:0 0 5px 2px}

/* streaks */
.streak{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.streak .aura{position:absolute;top:-40px;left:-30px;width:170px;height:170px;border-radius:50%;filter:blur(30px);opacity:.20;pointer-events:none}
.streak-head{display:flex;align-items:center;gap:13px;position:relative}
.streak-title{font-weight:700;letter-spacing:-.015em;font-size:16.5px}
.streak-lv{font-size:12.5px;color:var(--fog);margin-top:1px}
.checkbig{width:46px;height:46px;border-radius:15px;border:1.8px solid var(--line);flex:none;display:grid;place-items:center;margin-left:auto;transition:.2s}
.checkbig svg{width:21px;height:21px;stroke:var(--dim);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.checkbig.on{background:var(--ember);border-color:var(--ember)}
.checkbig.on svg{stroke:#160800}
.checkbig.on{animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.86)}100%{transform:scale(1)}}
.dots{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;margin-top:15px}
.dots i{aspect-ratio:1;border-radius:2.5px;background:#1B2227}
.grid-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.grid-cal .dh{font-size:11px;color:var(--dim);padding-bottom:3px}
.day{aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-variant-numeric:tabular-nums;background:var(--raise);border:1px solid transparent;position:relative}
.day.out{opacity:.25}
.day.sel{border-color:var(--ember)}
.day.today{color:var(--ember);font-weight:800}
.day i{width:5px;height:5px;border-radius:50%;background:var(--dim);display:block}
.day i.done{background:var(--ember)}

/* imc scale */
.scale{height:11px;border-radius:99px;margin:16px 0 7px;position:relative;
  background:linear-gradient(90deg,#4E9FC4 0%,#4E9FC4 14%,#4FBF7E 14%,#4FBF7E 40%,#E8A33D 40%,#E8A33D 60%,#E0553F 60%,#E0553F 100%)}
.scale b{position:absolute;top:-6px;width:4px;height:23px;border-radius:99px;background:var(--bone);box-shadow:0 0 0 3px var(--ink);transition:left .5s cubic-bezier(.3,.9,.3,1)}
.scale-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim)}

/* measurement bar */
.mrow{padding:13px 0;border-bottom:1px solid var(--line)}
.mrow .l{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.mrow .l b{font-weight:600;font-size:14.5px}
.mbar{height:6px;border-radius:99px;background:var(--raise);position:relative;overflow:hidden}
.mbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#8A3A0E,var(--ember));transition:width .5s}
.mbar>u{position:absolute;top:-3px;width:2px;height:12px;background:var(--fog);border-radius:99px}

/* rings */
.rings{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v .num{font-size:21px}
.ring .v span{font-size:10.5px;color:var(--fog)}
.macro{flex:1}
.macro .m{margin-bottom:11px}
.macro .m:last-child{margin:0}
.macro .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.macro .t b{font-weight:600}

.seg{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:16px}
.seg button{flex:1;padding:9px;border-radius:11px;font-size:14.5px;color:var(--fog);font-weight:600;transition:.15s}
.seg button.on{background:var(--surface);color:var(--bone);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.rs{color:var(--steel);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
.rank{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.rank .pos{width:22px;flex:none;text-align:center;font-variant-numeric:tabular-nums;font-weight:800;color:var(--dim);font-size:15px}
.rank.top .pos{color:var(--steel)}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim);margin-left:6px;white-space:nowrap}
.tag.meu{color:var(--steel);border-color:#4E9FC455}
/* sheet */
.sheet{position:fixed;inset:0;z-index:90;display:none}
.sheet.on{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--surface);border-radius:26px 26px 0 0;border-top:1px solid var(--line);
  padding:10px 18px calc(26px + var(--safe-b));animation:up .3s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(100%)}}
.handle{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.sheet h3{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.03em}
.stack>*{margin-bottom:11px}
.step{display:flex;gap:12px;padding:9px 0}
.step b{color:var(--ember);font-variant-numeric:tabular-nums;font-weight:800;flex:none;width:16px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--raise);border:1px solid var(--line);font-size:11.5px;color:var(--fog);margin:0 5px 5px 0}
.res{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.gdot{width:9px;height:9px;border-radius:50%;flex:none}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:120;
  background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:88vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
</style>
</head>
<body>
<div id="app">

  <div class="top">
    <div><h1 id="topTitle">Hoje</h1><div class="sub" id="topSub"></div></div>
    <button class="iconbtn" id="btnCfg" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>

  <!-- ============ HOJE ============ -->

    <div id="hoje-hero"></div>
    <div id="hoje-ex"></div>
    <div class="sect"><h2>Sequências</h2><button id="goStreaks">Ver todas</button></div>
    <div class="scroller" id="hoje-streaks"></div>
    <div class="sect"><h2>Você hoje</h2></div>

  <!-- ============ AGENDA ============ -->
  <section class="screen" id="s-agenda">

        <button class="iconbtn" id="mPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>

        <button class="iconbtn" id="mNext"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>

  <!-- ============ COMER ============ -->

    <button class="tab" data-s="corpo"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M12 14l-3.5 7M12 14l3.5 7M5.5 9.5L12 8l6.5 1.5"/></svg><span>Corpo</span></button>

<script>
/* ============================================================
   BASE DE EXERCÍCIOS — reconhecimento por nome
   ============================================================ */
const GRUPOS={
  peito:{n:"Peito",c:"#E0553F"}, costas:{n:"Costas",c:"#4E9FC4"}, ombro:{n:"Ombro",c:"#B07FE0"},
  biceps:{n:"Bíceps",c:"#FF6B1A"}, triceps:{n:"Tríceps",c:"#E8A33D"}, antebraco:{n:"Antebraço",c:"#FFD84D"},
  perna:{n:"Pernas",c:"#4FBF7E"}, gluteo:{n:"Glúteo",c:"#5FD3A8"}, pant:{n:"Panturrilha",c:"#7FCBA0"},
  abdomen:{n:"Abdômen",c:"#9AA7AD"}, cardio:{n:"Cardio",c:"#6C8FE0"}
};
const EXDB=[
{n:"Supino reto com barra",a:["supino","supino reto","supino barra"],g:"peito",e:"Barra + banco",p:["Deite no banco com os pés firmes no chão e as escápulas apertadas uma contra a outra.","Pegada um pouco mais aberta que os ombros, punhos alinhados com os cotovelos.","Desça a barra controlado até tocar de leve o meio do peito, cotovelos a ~45° do corpo.","Empurre para cima sem travar o cotovelo no topo."],t:"Não abra o cotovelo a 90° — é o caminho mais rápido para dor no ombro."},
{n:"Supino inclinado com halteres",a:["supino inclinado","inclinado halter","supino inclinado halteres"],g:"peito",e:"Halteres + banco inclinado",p:["Banco entre 30° e 45°. Mais que isso vira exercício de ombro.","Suba os halteres com os cotovelos levemente à frente do tronco.","Desça até sentir alongar o peito, sem forçar a articulação.","Suba juntando os halteres sem batê-los."],t:"Escolha um peso que te deixe parar 2 repetições antes da falha total."},
{n:"Crucifixo com halteres",a:["crucifixo","voador com halter","fly"],g:"peito",e:"Halteres + banco",p:["Cotovelos levemente flexionados e travados nesse ângulo o tempo todo.","Abra os braços em arco, sentindo o peito alongar.","Feche desenhando o mesmo arco, sem transformar em supino."],t:"Peso leve aqui. O ganho vem do alongamento, não da carga."},
{n:"Crossover na polia",a:["crossover","cross over","polia peito"],g:"peito",e:"Polia alta",p:["Um pé à frente, tronco levemente inclinado.","Puxe as manoplas em arco até cruzarem na frente do quadril.","Segure meio segundo na contração e volte devagar."],t:"O tronco fica parado; só os braços se movem."},
{n:"Supino máquina",a:["supino na maquina","peck press","maquina peito"],g:"peito",e:"Máquina",p:["Ajuste o banco para que as manoplas fiquem na altura do meio do peito.","Empurre até quase estender e volte controlado."],t:"Ótimo para as últimas séries, quando o peso livre já cansou."},
{n:"Voador (peck deck)",a:["voador","peck deck","maquina voador"],g:"peito",e:"Máquina",p:["Costas totalmente apoiadas, cotovelos na altura dos ombros.","Feche até quase encostar as manoplas e volte devagar."],t:"Não deixe o peso bater na volta — mantenha tensão."},
{n:"Flexão de braço",a:["flexao","flexão","push up","apoio"],g:"peito",e:"Peso do corpo",p:["Mãos pouco mais abertas que os ombros, corpo em linha reta.","Desça até o peito ficar a um punho do chão.","Suba empurrando o chão, sem deixar o quadril cair."],t:"Se estiver fácil, eleve os pés num banco."},
{n:"Barra fixa",a:["barra fixa","pull up","chin up","barra"],g:"costas",e:"Barra fixa",p:["Pegada pronada, um pouco mais aberta que os ombros.","Puxe pensando em levar os cotovelos para o bolso, peito em direção à barra.","Desça controlado até estender quase completo."],t:"Sem conseguir ainda? Use a máquina assistida ou faça só a descida, bem devagar."},
{n:"Puxada frontal na polia",a:["puxada","puxada frontal","pulley","pulldown","puxador"],g:"costas",e:"Polia alta",p:["Joelhos travados no apoio, tronco levemente inclinado para trás.","Puxe a barra até a parte de cima do peito, ombros para baixo e para trás.","Volte controlado deixando as escápulas subirem no fim."],t:"Puxada atrás da nuca não vale a pena — mais risco, mesmo resultado."},
{n:"Remada curvada com barra",a:["remada curvada","remada barra","remada"],g:"costas",e:"Barra",p:["Quadril para trás, tronco a ~45°, coluna neutra.","Puxe a barra na direção do umbigo, cotovelos rentes ao corpo.","Desça controlado sem arredondar as costas."],t:"Se a lombar começar a arredondar, o peso está alto demais."},
{n:"Remada baixa (polia)",a:["remada baixa","remada sentada","remada na polia","seated row"],g:"costas",e:"Polia baixa",p:["Sente com joelhos levemente flexionados, coluna ereta.","Puxe até o abdômen, apertando as escápulas.","Volte deixando o peso alongar as costas, sem jogar o tronco."],t:"O tronco não é gangorra — mantenha ele quase parado."},
{n:"Remada unilateral com halter",a:["remada serrote","serrote","remada unilateral","remada halter"],g:"costas",e:"Halter + banco",p:["Uma mão e um joelho no banco, costas paralelas ao chão.","Puxe o halter na direção do quadril, cotovelo colado.","Desça alongando bem lá embaixo."],t:"Excelente para corrigir diferença entre os lados."},
{n:"Pulldown com corda (pullover)",a:["pullover","pulldown corda","pullover polia"],g:"costas",e:"Polia alta",p:["Braços quase estendidos, tronco levemente inclinado.","Puxe a corda em arco até as coxas, sem dobrar o cotovelo.","Volte devagar sentindo o dorsal alongar."],t:"Isola o dorsal sem envolver o bíceps — bom finalizador."},
{n:"Levantamento terra",a:["terra","deadlift","levantamento terra"],g:"costas",e:"Barra",p:["Barra colada na canela, pés na largura do quadril.","Peito aberto, coluna neutra, ombros levemente à frente da barra.","Empurre o chão com as pernas e estenda o quadril.","Desça pelo mesmo caminho, controlando."],t:"Aprenda a técnica com carga leve antes de pensar em peso. Coluna neutra é inegociável."},
{n:"Hiperextensão lombar",a:["hiperextensao","lombar","extensao lombar","banco romano"],g:"costas",e:"Banco romano",p:["Quadril apoiado logo abaixo do osso da bacia.","Desça flexionando o quadril, coluna neutra.","Suba até o corpo formar uma linha reta, sem hiperestender."],t:"Não jogue o tronco para trás no topo."},
{n:"Desenvolvimento com halteres",a:["desenvolvimento","desenvolvimento halteres","shoulder press","desenvolvimento ombro"],g:"ombro",e:"Halteres",p:["Sentado com encosto, halteres na altura das orelhas.","Empurre para cima levando os halteres a se aproximarem.","Desça controlado até os cotovelos passarem pouco dos ombros."],t:"Abdômen firme para não arquear a lombar."},
{n:"Elevação lateral",a:["elevacao lateral","elevação lateral","lateral raise","levantamento lateral"],g:"ombro",e:"Halteres",p:["Halteres ao lado do corpo, cotovelo levemente flexionado.","Suba pelos lados até a altura dos ombros, mindinho um tico mais alto.","Desça bem devagar — a descida é onde está o ganho."],t:"É o exercício que mais gente faz com peso demais. Vá leve e faça bonito."},
{n:"Elevação frontal",a:["elevacao frontal","elevação frontal","front raise"],g:"ombro",e:"Halteres ou anilha",p:["Braços à frente do corpo, cotovelo quase estendido.","Suba até a altura dos olhos.","Desça controlado sem balançar o tronco."],t:"Um braço de cada vez ajuda a não usar impulso."},
{n:"Crucifixo inverso",a:["crucifixo inverso","voador inverso","posterior de ombro","reverse fly"],g:"ombro",e:"Halteres ou máquina",p:["Tronco inclinado à frente, braços pendurados.","Abra os braços para os lados apertando as escápulas.","Volte controlado."],t:"Trabalha o ombro de trás — o mais esquecido e o que mais melhora a postura."},
{n:"Desenvolvimento militar com barra",a:["militar","desenvolvimento militar","overhead press","press militar"],g:"ombro",e:"Barra",p:["Barra na altura das clavículas, pegada pouco mais aberta que os ombros.","Empurre acima da cabeça, passando o rosto para trás da barra.","Trave em cima com a barra alinhada ao meio do pé."],t:"Glúteo e abdômen contraídos evitam arquear a lombar."},
{n:"Encolhimento de ombros",a:["encolhimento","trapezio","shrug"],g:"ombro",e:"Halteres ou barra",p:["Braços estendidos ao lado do corpo.","Suba os ombros na direção das orelhas, sem girar.","Segure um segundo em cima e desça devagar."],t:"Girar o ombro não faz nada além de desgastar a articulação."},
{n:"Rosca direta com barra",a:["rosca direta","rosca barra","biceps barra","rosca"],g:"biceps",e:"Barra W ou reta",p:["Cotovelos colados ao tronco, ombros para trás.","Suba a barra fechando o cotovelo, sem mexer o ombro.","Desça controlado até quase estender."],t:"Se o tronco balança, tirou o bíceps do trabalho."},
{n:"Rosca alternada com halteres",a:["rosca alternada","rosca halteres","rosca alternada halteres"],g:"biceps",e:"Halteres",p:["Braços ao lado do corpo, palmas voltadas para dentro.","Suba girando o punho até a palma ficar para cima.","Desça devagar desfazendo a rotação."],t:"A rotação (supinação) é o que dá o pico do bíceps."},
{n:"Rosca martelo",a:["martelo","rosca martelo","hammer curl"],g:"biceps",e:"Halteres",p:["Pegada neutra, palmas voltadas uma para a outra o tempo todo.","Suba mantendo o cotovelo parado.","Desça controlado."],t:"Melhor exercício para engrossar o braço — pega braquial e antebraço junto."},
{n:"Rosca scott",a:["scott","rosca scott","banco scott","preacher curl"],g:"biceps",e:"Banco scott",p:["Axila apoiada no topo do banco, braços bem encaixados.","Suba até pouco antes do cotovelo fechar totalmente.","Desça até quase estender, sem soltar de repente."],t:"Nunca solte o peso na descida aqui — é onde o bíceps se lesiona."},
{n:"Rosca concentrada",a:["rosca concentrada","concentrada","concentration curl"],g:"biceps",e:"Halter",p:["Sentado, cotovelo apoiado na parte interna da coxa.","Suba concentrando no bíceps, sem ajuda do ombro.","Desça devagar até estender."],t:"Peso leve e execução limpa. É exercício de finalização."},
{n:"Rosca inversa",a:["rosca inversa","rosca pronada","reverse curl"],g:"antebraco",e:"Barra W",p:["Pegada pronada (palmas para baixo), cotovelos colados.","Suba até a altura do peito.","Desça bem controlado."],t:"O melhor exercício para a parte de cima do antebraço."},
{n:"Rosca de punho",a:["rosca punho","flexao de punho","punho","wrist curl"],g:"antebraco",e:"Barra ou halteres",p:["Antebraços apoiados no banco, punhos para fora da borda, palmas para cima.","Deixe a barra rolar até a ponta dos dedos.","Enrole de volta e suba o punho o máximo possível."],t:"Amplitude completa, inclusive deixando rolar nos dedos — é aí que engrossa."},
{n:"Rosca de punho invertida",a:["rosca punho invertida","extensao de punho","punho invertido"],g:"antebraco",e:"Barra",p:["Mesma posição, mas palmas para baixo.","Levante o dorso da mão o máximo que der.","Desça devagar."],t:"Peso bem menor que na versão normal. Equilibra o antebraço."},
{n:"Farmer walk",a:["farmer walk","caminhada do fazendeiro","farmer"],g:"antebraco",e:"Halteres pesados",p:["Pegue halteres pesados, um em cada mão.","Ombros para trás, abdômen firme.","Caminhe 20 a 40 metros sem deixar cair."],t:"Pega antebraço, trapézio e core de uma vez. Ótimo para finalizar o treino."},
{n:"Pegada em toalha na barra",a:["toalha","pegada toalha","towel hang"],g:"antebraco",e:"Toalha + barra",p:["Passe uma toalha por cima da barra e segure as pontas.","Fique pendurado o máximo de tempo que aguentar."],t:"Brutal para pegada. Comece com 15 a 20 segundos."},
{n:"Tríceps na polia com corda",a:["triceps corda","triceps polia","triceps na polia","pushdown"],g:"triceps",e:"Polia alta",p:["Cotovelos colados ao tronco e fixos.","Empurre para baixo e abra a corda no final.","Volte só até o cotovelo formar 90°."],t:"O cotovelo não pode viajar para frente e para trás."},
{n:"Tríceps testa",a:["triceps testa","testa","skull crusher","frances"],g:"triceps",e:"Barra W + banco",p:["Deitado, barra acima da testa, cotovelos apontados para o teto.","Desça flexionando só o cotovelo, até perto da testa.","Suba sem deixar o cotovelo abrir."],t:"Se doer o cotovelo, troque por halteres com pegada neutra."},
{n:"Tríceps francês",a:["triceps frances","frances halter","overhead triceps"],g:"triceps",e:"Halter",p:["Sentado, halter acima da cabeça com as duas mãos.","Desça atrás da nuca flexionando o cotovelo.","Suba estendendo sem travar bruscamente."],t:"É o que mais alonga a cabeça longa do tríceps."},
{n:"Mergulho no banco",a:["mergulho","banco triceps","dips banco","tricep dips"],g:"triceps",e:"Banco",p:["Mãos na borda do banco, quadril à frente.","Desça até o cotovelo formar 90°.","Suba empurrando o banco."],t:"Não desça demais — o ombro sofre."},
{n:"Paralelas",a:["paralela","paralelas","dips"],g:"triceps",e:"Barras paralelas",p:["Tronco quase vertical se o foco é tríceps.","Desça até os ombros ficarem na altura dos cotovelos.","Suba estendendo os braços."],t:"Inclinar o tronco à frente joga o foco para o peito."},
{n:"Agachamento livre",a:["agachamento","agacho","squat","agachamento livre"],g:"perna",e:"Barra + rack",p:["Barra apoiada no trapézio, pés na largura dos ombros, pontas levemente para fora.","Desça empurrando o quadril para trás e os joelhos para fora.","Desça até a coxa ficar paralela ao chão ou um pouco abaixo.","Suba empurrando o chão com o pé inteiro."],t:"Joelho pode passar da ponta do pé, sim — o que não pode é a coluna arredondar."},
{n:"Leg press",a:["leg press","leg","legpress"],g:"perna",e:"Máquina",p:["Pés na largura dos ombros no meio da plataforma.","Desça até o joelho formar ~90°, sem tirar o quadril do banco.","Empurre sem travar o joelho no topo."],t:"Quadril saindo do encosto lá embaixo = risco para a lombar."},
{n:"Cadeira extensora",a:["extensora","cadeira extensora","leg extension"],g:"perna",e:"Máquina",p:["Costas apoiadas, eixo do joelho alinhado ao da máquina.","Estenda até quase travar e segure meio segundo.","Desça controlado."],t:"Peso moderado. Carga muito alta aqui castiga o joelho."},
{n:"Mesa flexora",a:["flexora","mesa flexora","cadeira flexora","leg curl"],g:"perna",e:"Máquina",p:["Deitado, o rolo logo acima do calcanhar.","Flexione levando o calcanhar ao glúteo.","Volte devagar sem soltar."],t:"Quadril colado no banco — não levante a bunda para ajudar."},
{n:"Afundo",a:["afundo","avanco","lunge","passada"],g:"perna",e:"Halteres",p:["Dê um passo à frente e desça o joelho de trás em direção ao chão.","Tronco ereto, joelho da frente alinhado ao pé.","Empurre com o calcanhar da frente para voltar."],t:"Passo curto pega mais quadríceps, passo longo pega mais glúteo."},
{n:"Agachamento búlgaro",a:["bulgaro","búlgaro","agachamento bulgaro","bulgarian split squat"],g:"perna",e:"Halteres + banco",p:["Pé de trás apoiado no banco, pé da frente bem à frente.","Desça vertical até a coxa da frente ficar paralela.","Suba empurrando o calcanhar da frente."],t:"Um dos exercícios mais eficientes de perna. Também é um dos mais difíceis."},
{n:"Stiff",a:["stiff","levantamento terra romeno","romeno","rdl"],g:"perna",e:"Barra ou halteres",p:["Joelhos levemente flexionados e travados nesse ângulo.","Empurre o quadril para trás descendo a barra colada na perna.","Desça até sentir o posterior alongar e volte estendendo o quadril."],t:"Não é agachamento. O movimento é do quadril, não do joelho."},
{n:"Cadeira abdutora",a:["abdutora","cadeira abdutora","abducao"],g:"gluteo",e:"Máquina",p:["Sentado, abra as pernas contra a resistência.","Segure um segundo aberto e volte devagar."],t:"Inclinar o tronco à frente aumenta o recrutamento do glúteo."},
{n:"Elevação pélvica",a:["elevacao pelvica","hip thrust","gluteo barra"],g:"gluteo",e:"Barra + banco",p:["Costas apoiadas no banco na altura das escápulas, barra sobre o quadril.","Suba o quadril até o tronco ficar paralelo ao chão.","Aperte o glúteo em cima e desça controlado."],t:"Queixo apontando para o peito ajuda a não forçar a lombar."},
{n:"Panturrilha em pé",a:["panturrilha","panturrilha em pe","gemeos","calf raise"],g:"pant",e:"Máquina ou step",p:["Ponta dos pés no degrau, calcanhar livre.","Desça o calcanhar o máximo possível.","Suba na ponta do pé e segure um segundo."],t:"Amplitude completa e pausa em cima valem mais que carga alta."},
{n:"Panturrilha sentado",a:["panturrilha sentado","soleo","seated calf"],g:"pant",e:"Máquina",p:["Joelhos a 90° com o apoio sobre as coxas.","Desça o calcanhar e suba na ponta do pé."],t:"Com o joelho dobrado, o foco vai para o sóleo, embaixo da panturrilha."},
{n:"Prancha",a:["prancha","plank","prancha isometrica"],g:"abdomen",e:"Peso do corpo",p:["Antebraços no chão, cotovelos abaixo dos ombros.","Corpo em linha reta da cabeça ao calcanhar.","Contraia abdômen e glúteo e segure o tempo."],t:"Quadril caindo ou empinado tira todo o efeito."},
{n:"Abdominal supra",a:["abdominal","supra","crunch","abdominal supra"],g:"abdomen",e:"Peso do corpo",p:["Deitado, joelhos dobrados, mãos na lateral da cabeça.","Enrole a coluna tirando as escápulas do chão.","Desça devagar sem relaxar completamente."],t:"Não puxe a nuca com as mãos."},
{n:"Elevação de pernas",a:["elevacao de pernas","infra","leg raise","abdominal infra"],g:"abdomen",e:"Barra ou banco",p:["Pendurado ou deitado, pernas estendidas.","Suba as pernas contraindo o abdômen, não o quadril.","Desça controlado sem balançar."],t:"Se balançar, dobre os joelhos e faça mais devagar."},
{n:"Abdominal na polia",a:["abdominal polia","crunch polia","abdominal na corda"],g:"abdomen",e:"Polia alta",p:["Ajoelhado de costas para a polia, corda ao lado da cabeça.","Enrole o tronco levando o cotovelo em direção ao joelho.","Volte controlado."],t:"O movimento é enrolar a coluna, não flexionar o quadril."},
{n:"Esteira",a:["esteira","corrida","treadmill","caminhada"],g:"cardio",e:"Esteira",p:["Comece com 5 minutos leves para aquecer.","Mantenha um ritmo em que ainda consiga falar frases curtas.","Termine com 3 minutos desacelerando."],t:"Se o objetivo é ganhar massa, deixe o cardio para o fim ou outro dia."},
{n:"Bicicleta ergométrica",a:["bicicleta","bike","ergometrica","spinning"],g:"cardio",e:"Bike",p:["Ajuste o banco: com o pedal embaixo, o joelho fica quase estendido.","Mantenha cadência constante."],t:"Menos impacto no joelho que a esteira."},
{n:"Escada / simulador",a:["escada","simulador de escada","stairmaster","transport"],g:"cardio",e:"Máquina",p:["Postura ereta, sem se pendurar no apoio.","Pise com o pé inteiro no degrau."],t:"Se apoiar o peso nos braços, o gasto cai pela metade."},
{n:"Pular corda",a:["corda","pular corda","jump rope"],g:"cardio",e:"Corda",p:["Cotovelos perto do corpo, giro vindo do punho.","Salte poucos centímetros, caindo na ponta do pé."],t:"Comece com blocos de 30 segundos."}

   ============================================================ */
function buscarEx(q){
  const nq=norm(q); if(!nq)return[];
  const tq=nq.split(" ").filter(t=>t.length>2);
  return EXDB.map(x=>{
    const nn=norm(x.n),als=[nn,...x.a.map(norm)];
    let sc=0;
    for(const a of als){
      // proporção entre os tamanhos evita que um apelido curto ("rosca")
      // vença o nome certo ("rosca martelo") numa busca longa
      const rt=Math.min(a.length,nq.length)/Math.max(a.length,nq.length);
      if(a===nq)sc=Math.max(sc,100);
      else if(a.startsWith(nq)||nq.startsWith(a))sc=Math.max(sc,55+40*Math.pow(rt,1.5));
      else if(a.includes(nq)||nq.includes(a))sc=Math.max(sc,45+35*Math.pow(rt,1.5));
    }
    if(tq.length){
      const at=new Set(als.join(" ").split(" "));
      let hit=0;for(const t of tq){for(const w of at){if(w===t||w.startsWith(t)||t.startsWith(w)){hit++;break}}}
      sc=Math.max(sc,hit/tq.length*72);
    }
    return{x,sc};
  }).filter(r=>r.sc>=42).sort((a,b)=>b.sc-a.sc).slice(0,8).map(r=>r.x);
}
function acharEx(nome){const r=buscarEx(nome);return r.length?r[0]:null}

const UNI={kg:1000,g:1,L:1000,ml:1};
function custoPorG(nome){                     // R$ por grama do alimento PRONTO
  const p=S.precos[nome],f=FOODDB.find(x=>x.n===nome);
  if(!p||!f||!p.v||!p.q)return null;
  const gramas=p.u==="un"?p.q*f.w:p.q*(UNI[p.u]||1);
  if(!gramas)return null;
  return (p.v/gramas)/(f.rend||1);
}
function custoPorcao(nome){const c=custoPorG(nome),f=FOODDB.find(x=>x.n===nome);
  return c==null||!f?null:c*f.w}
function custoItem(it){
  if(it.rs!=null)return it.rs;                // lançamento manual com preço
  const c=custoPorcao(it.nome);return c==null?0:c*it.qtd}
function custoDia(k){return (S.refe[k]||[]).reduce((a,x)=>a+custoItem(x),0)}
function mediaDia(){
  const ks=Object.keys(S.refe).filter(k=>(S.refe[k]||[]).length).sort().slice(-14);
  if(!ks.length)return 0;
  return ks.reduce((a,k)=>a+custoDia(k),0)/ks.length}
function ranking(metrica){                    // "prot" ou "kcal"
  return FOODDB.map(f=>{const c=custoPorcao(f.n);
      if(c==null||c<=0)return null;
      if(metrica==="prot"){
        // só entra quem é fonte de proteína de verdade: pelo menos 20% das
        // calorias vindo de proteína e no mínimo 4 g na porção. Sem isso o
        // arroz lidera a lista sendo que ninguém come 1 kg dele por proteína.
        if(f.p<4||(f.p*4)/f.k<0.20)return null;
        return{f,c,v:c/f.p*10}}
      if(f.k<5)return null;return{f,c,v:c/f.k*100}})
    .filter(Boolean).sort((a,b)=>a.v-b.v)}
function maisBaratoEm(nome){
  const f=FOODDB.find(x=>x.n===nome);if(!f)return null;
  const hs=S.precoHist.filter(x=>x.n===nome&&x.local);
  if(hs.length<2)return null;
  const porLocal={};
  hs.forEach(x=>{
    const g=x.u==="un"?x.q*f.w:x.q*(UNI[x.u]||1);
    if(!g)return;
    const pg=(x.v/g)/(f.rend||1);      // mesmo critério do resto do app: preço do alimento pronto
    if(porLocal[x.local]==null||pg<porLocal[x.local])porLocal[x.local]=pg});
  const ls=Object.entries(porLocal).sort((a,b)=>a[1]-b[1]);
  if(ls.length<2)return null;
  return{local:ls[0][0],pg:ls[0][1],piorLocal:ls[ls.length-1][0],pior:ls[ls.length-1][1],lojas:ls.length}}

const TIPOS=[["cafe","Café da manhã"],["almoco","Almoço"],["lanche","Lanche"],["janta","Janta"]];
function ring(pc,cor,val,lbl){
  const R=42,C=2*Math.PI*R,off=C-Math.min(1,pc)*C;
  return `<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96">
    <circle cx="48" cy="48" r="${R}" fill="none" stroke="var(--raise)" stroke-width="8"/>
    <circle cx="48" cy="48" r="${R}" fill="none" stroke="${cor}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s cubic-bezier(.3,.9,.3,1)"/></svg>
    <div class="v"><span class="num">${val}</span><span>${lbl}</span></div></div>`}
function bar(v,t,cor){const pc=Math.min(100,t?v/t*100:0);
  return `<div class="mbar"><i style="width:${pc}%;background:${cor}"></i></div>`}

const TITULOS={hoje:"Hoje",agenda:"Agenda",streaks:"Sequências",corpo:"Corpo",comer:"Comer"};

function ir(s){
  telaAtual=s;
  document.querySelectorAll(".screen").forEach(el=>el.classList.toggle("on",el.id==="s-"+s));

  window.scrollTo(0,0);render()}
function render(){
  if(telaAtual==="hoje")renderHoje();
  if(telaAtual==="agenda")renderAgenda();
  if(telaAtual==="streaks")renderStreaks();
  if(telaAtual==="corpo")renderCorpo();
  if(telaAtual==="comer")renderComer()}

function checarTreinoCompleto(k){
  const d=S.agenda[k];if(!d||!d.ex||!d.ex.length)return;
  if(k!==hoje())return;
  if(!d.ex.every(x=>x.done))return;
  const st=S.streaks.find(x=>norm(x.nome)==="treino");
  if(st&&!st.dias[k]){st.dias[k]=true;save();
    const n=seqAtual(st),nv=nivel(n),pr=proxNivel(n);
    toast(`Treino fechado. ${n} ${n===1?"dia":"dias"} — ${nv.nome}${pr?", faltam "+(pr.min-n)+" para "+pr.nome:""}`)}
  else toast("Treino fechado. Bom trabalho.")}

document.addEventListener("click",e=>{
  const tab=e.target.closest(".tab");if(tab){ir(tab.dataset.s);return}
  if(e.target.closest("[data-close]")){closeSheet();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,k=b.dataset.k,i=+b.dataset.i,id=b.dataset.id;

  if(a==="expand"){const el=b.closest(".ex"),key=el.dataset.k+":"+el.dataset.i;
    el.classList.toggle("open");
    el.classList.contains("open")?ABERTOS.add(key):ABERTOS.delete(key)}
  else if(a==="tick"){const x=S.agenda[k].ex[i];x.done=!x.done;save();render();if(x.done)checarTreinoCompleto(k)}
  else if(a==="info"){sheetInfoEx(b.dataset.ex)}
  else if(a==="delex"){S.agenda[k].ex.splice(i,1);save();render()}
  else if(a==="addex"){sheetAddEx(k)}
  else if(a==="pushex"){const n=b.dataset.n;const d=S.agenda[k]||{hora:"18:00",ex:[]};
    d.ex=d.ex||[];d.ex.push({ex:n,s:3,r:"10",peso:ultimoPeso(n,k),meta:0,obs:"",done:false});
    S.agenda[k]=d;save();closeSheet();render();toast(n+" adicionado")}
  else if(a==="pickTpl"){sheetPickTpl(k)}
  else if(a==="settpl"){aplicarTpl(k,id);closeSheet();render()}
  else if(a==="tplvazio"){S.agenda[k]={hora:"18:00",ex:[]};save();closeSheet();render();sheetAddEx(k)}
  else if(a==="rmday"){delete S.agenda[k];save();render()}
  else if(a==="selday"){selDia=k;renderAgenda()}
  else if(a==="tempo"){sheetTempo();tDraw()}
  else if(a==="tset"){TSEG=+b.dataset.s;tDraw();document.querySelectorAll('[data-act="tset"]').forEach(x=>x.classList.toggle("on",x===b))}
  else if(a==="tgo"){
    if(TRUN){clearInterval(TRUN);TRUN=null;$("#tBtn").textContent="Continuar"}
    else{$("#tBtn").textContent="Pausar";
      TRUN=setInterval(()=>{TSEG--;tDraw();if(TSEG<=0){clearInterval(TRUN);TRUN=null;
        if(navigator.vibrate)navigator.vibrate([200,100,200]);const bt=$("#tBtn");if(bt)bt.textContent="Acabou";toast("Descanso acabou")}},1000)}}

  else if(a==="edittpl"){sheetTpl(id)}
  else if(a==="tcor"){TMP.cor=b.dataset.c;document.querySelectorAll('[data-act="tcor"]').forEach(x=>x.style.borderColor=x.dataset.c===TMP.cor?"var(--bone)":"transparent")}
  else if(a==="tdel"){TMP.nome=$("#tNome").value;TMP.ex.splice(i,1);$("#tplEx").innerHTML=tplExHTML()}
  else if(a==="taddex"){TMP.nome=$("#tNome").value;
    openSheet(`<h3>Adicionar ao treino</h3><input id="qEx" placeholder="Nome do exercício" autocomplete="off" style="margin-top:12px"><div id="resEx" style="margin-top:6px"></div>`);
    const q=$("#qEx");q.focus();
    const run=()=>{const v=q.value.trim();const r=v?buscarEx(v):EXDB.slice(0,8);
      $("#resEx").innerHTML=r.map(x=>{const g=GRUPOS[x.g];
        return `<button class="res" data-act="tpushex" data-n="${esc(x.n)}"><span class="gdot" style="background:${g.c}"></span>
        <span style="flex:1"><b style="font-weight:600">${esc(x.n)}</b><span class="tiny muted" style="display:block">${g.n}</span></span></button>`}).join("")
        +(v?`<button class="btn ghost slim" data-act="tpushex" data-n="${esc(v)}" style="margin-top:12px">Adicionar “${esc(v)}” assim mesmo</button>`:"")};
    q.addEventListener("input",run);run()}
  else if(a==="tpushex"){TMP.ex.push({ex:b.dataset.n,s:3,r:"10"});desenhaTpl(!!S.tpl.find(t=>t.id===TMP.id))}
  else if(a==="tsave"){const n=($("#tNome")||{}).value||TMP.nome;TMP.nome=(n||"").trim()||"Treino sem nome";
    const ix=S.tpl.findIndex(t=>t.id===TMP.id);
    ix>=0?S.tpl[ix]=TMP:S.tpl.push(TMP);
    save();closeSheet();render();toast("Treino salvo")}
  else if(a==="tdelall"){S.tpl=S.tpl.filter(t=>t.id!==id);save();closeSheet();render();toast("Treino apagado")}

  else if(a==="togstreak"||a==="quickstreak"){
    const st=S.streaks.find(x=>x.id===id),kk=hoje();
    if(st.dias[kk])delete st.dias[kk];else st.dias[kk]=true;
    save();render();
    if(st.dias[kk]){const n=seqAtual(st),nv=nivel(n),pr=proxNivel(n);
      if(n===nv.min&&n>0)toast(`Novo nível: ${nv.nome}`);
      else toast(`${n} ${n===1?"dia":"dias"}${pr?` · faltam ${pr.min-n} para ${pr.nome}`:""}`)}}
  else if(a==="editstreak"){sheetStreak(id)}
  else if(a==="sicone"){TMP.icone=b.dataset.ic;document.querySelectorAll('[data-act="sicone"]').forEach(x=>x.style.borderColor=x.dataset.ic===TMP.icone?"var(--ember)":"var(--line)")}
  else if(a==="ssave"){TMP.nome=($("#sNome").value||"").trim()||"Sem nome";
    delete TMP.novo;const ix=S.streaks.findIndex(x=>x.id===TMP.id);
    ix>=0?S.streaks[ix]=TMP:S.streaks.push(TMP);
    save();closeSheet();render();toast("Sequência salva")}
  else if(a==="sdel"){S.streaks=S.streaks.filter(x=>x.id!==id);save();closeSheet();render()}

  else if(a==="savepeso"){const v=+$("#pV").value;if(v>0){S.pesos.push({data:hoje(),v});S.perfil.peso=v;save();closeSheet();render();toast("Peso registrado")}}
  else if(a==="savemedida"){const o={data:hoje()};MEDIDAS.forEach(([kk])=>{const el=$("#md_"+kk);if(el&&+el.value>0)o[kk]=+el.value});
    S.perfil.punho=+$("#mPunho").value||S.perfil.punho;S.medidas.push(o);save();closeSheet();render();toast("Medidas salvas")}

  else if(a==="addfood"){sheetFood(b.dataset.t)}
  else if(a==="pickfood"){sheetQtd(b.dataset.n,b.dataset.t)}
  else if(a==="qset"){$("#qN").value=b.dataset.v}
  else if(a==="savefood"){const f=FOODDB.find(x=>x.n===b.dataset.n),q=+$("#qN").value||1,kk=hoje();
    S.refe[kk]=S.refe[kk]||[];
    S.refe[kk].push({id:uid(),tipo:b.dataset.t,nome:f.n,u:f.u,qtd:q,k:f.k*q,p:f.p*q,c:f.c*q,g:f.g*q});
    save();closeSheet();render();toast(f.n+" adicionado")}
  else if(a==="manualfood"){const n=($("#mN").value||"").trim();if(!n){toast("Dê um nome ao item");return}
    const kk=hoje();S.refe[kk]=S.refe[kk]||[];
    S.refe[kk].push({id:uid(),tipo:b.dataset.t,nome:n,u:"porção",qtd:1,k:+$("#mK").value||0,p:+$("#mP").value||0,c:+$("#mC").value||0,g:+$("#mG").value||0,rs:+$("#mR").value||0});
    save();closeSheet();render();toast("Adicionado")}
  else if(a==="delfood"){const kk=hoje();S.refe[kk]=(S.refe[kk]||[]).filter(x=>x.id!==id);save();render()}
  else if(a==="cfgnutri"){sheetCfg()}
  else if(a==="cview"){comerView=b.dataset.v;window.scrollTo(0,0);renderComer()}
  else if(a==="addpreco"){sheetBuscaPreco()}
  else if(a==="editpreco"){sheetPreco(b.dataset.n)}
  else if(a==="savepreco"){const n=b.dataset.n,v=+$("#prV").value||0,q=+$("#prQ").value||0,u=$("#prU").value,l=($("#prL").value||"").trim();
    if(!v||!q){toast("Preencha valor e quantidade");return}
    S.precos[n]={v,q,u,local:l||undefined,est:false};
    S.precoHist.push({n,v,q,u,local:l||undefined,data:hoje()});
    if(S.precoHist.length>400)S.precoHist=S.precoHist.slice(-400);
    save();closeSheet();render();toast("Preço salvo")}
  else if(a==="setorc"){sheetOrcamento()}
  else if(a==="saveorc"){S.orcamento=+$("#orcV").value||0;save();closeSheet();render();toast("Orçamento salvo")}
  else if(a==="zerar"){if(confirm("Isso apaga treinos, sequências, medidas e refeições deste aparelho. Continuar?")){
    S=JSON.parse(JSON.stringify(DEF));save();closeSheet();render();toast("Tudo apagado")}}
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-inp]");if(!el)return;
  const t=el.dataset.inp,k=el.dataset.k,i=+el.dataset.i;
  if(t==="peso"||t==="meta"){S.agenda[k].ex[i][t]=+el.value||0;save();render()}
  else if(t==="obs"){S.agenda[k].ex[i].obs=el.value;save()}
  else if(t==="sr"){const m=el.value.split(/[x×]/);S.agenda[k].ex[i].s=+m[0]||3;S.agenda[k].ex[i].r=(m[1]||"10").trim();save();render()}
  else if(t==="hora"){S.agenda[k].hora=el.value;save();render()}
  else if(t==="pperfil"){const f=el.dataset.f;S.perfil[f]=f==="sexo"||f==="objetivo"?el.value:+el.value;save();render()}
  else if(t==="ts"){TMP.ex[i].s=+el.value||3}
  else if(t==="tr"){TMP.ex[i].r=el.value||"10"}
});

$("#addStreak").addEventListener("click",()=>sheetStreak(null));
$("#addTpl").addEventListener("click",()=>sheetTpl(null));
$("#addPeso").addEventListener("click",sheetPeso);
$("#addMedida").addEventListener("click",sheetMedida);
$("#addFood").addEventListener("click",()=>sheetFood("almoco"));
$("#mPrev").addEventListener("click",()=>{mesRef.setMonth(mesRef.getMonth()-1);renderAgenda()});
$("#mNext").addEventListener("click",()=>{mesRef.setMonth(mesRef.getMonth()+1);renderAgenda()});

if(!S.pesos.length&&S.perfil.peso)S.pesos.push({data:hoje(),v:S.perfil.peso});
if(!S.agenda[hoje()]&&S.tpl.length){/* deixa o dia livre; o usuário escolhe */}
save();ir("hoje");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
